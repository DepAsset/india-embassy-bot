name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960e1e9f6f4f4e5f3f0a4c9e6d4e6b4a6b6f # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m compileall app core access approval embassy migration verification
      # pytest exits with code 5 when the repository currently has no test
      # files. Treat that specific condition as a successful smoke-check while
      # preserving real test failures.
      - run: pytest -q || test $? -eq 5

name: RAJDOOT CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ci-test-token
      DISCORD_GUILD_ID: "1"
      DATABASE_URL: postgresql://ci:ci@localhost/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ruff diagnostics
        run: ruff check src tests --output-format=concise --exit-zero
      - name: Tests
        run: pytest -q

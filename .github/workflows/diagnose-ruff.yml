name: Diagnose Ruff

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ruff>=0.9,<1'
      - name: Capture Ruff output
        shell: bash
        run: |
          ruff check . > ruff-output.txt 2>&1 || true
          cat ruff-output.txt
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ruff-output.txt
          git commit -m "Capture Ruff diagnostics" || exit 0
          git push

name: Harden embassy flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply embassy flow hardening
        run: python scripts/patch_embassy_flow.py

      - name: Commit hardening changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rajdoot/verification_dashboard.py src/rajdoot/workflow_store.py src/rajdoot/embassy_workflow.py
          git commit -m "Harden embassy dashboard and request lifecycle"
          git push

name: Repair dashboard bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, '[dashboard-repair]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/dashboard_overhaul.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('AccessSource.MANUAL', 'AccessSource.GOVERNMENT_OVERRIDE')
          s = s.replace('EmbassyRequestsCog.embassy_dashboard.callback=admin_dashboard', 'EmbassyRequestsCog.embassy_dashboard._callback=admin_dashboard')
          s = s.replace('EmbassyRequestsCog.foreign_diplomat_dashboard.callback=foreign_dashboard', 'EmbassyRequestsCog.foreign_diplomat_dashboard._callback=foreign_dashboard')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/repair-dashboard.yml
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard_overhaul.py .github/workflows/repair-dashboard.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair dashboard bootstrap [dashboard-repair]'
          git push
